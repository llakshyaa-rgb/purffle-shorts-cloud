name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install
        run: pip install -e ".[dev]"
      - name: Studio JS syntax
        run: node --check purffle_shorts/web/app.js
      - name: Targeted lint (new creative director files)
        run: ruff check purffle_shorts/creative_director.py tests/test_creative_director.py
      - name: Tests (includes an offline end-to-end render)
        run: pytest -q
      - name: Full repository lint
        if: always()
        run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: purffle-shorts:ci
      - name: Smoke test
        run: docker run --rm purffle-shorts:ci --version
      - name: docker-compose.yml is valid
        run: touch .env && docker compose config -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the PyPI package
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
